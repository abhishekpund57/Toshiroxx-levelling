<style>
:root{--glow:#38e1ff66;--glow2:#38e1ff24;--navbg:#06090cf2;--sheet:#10161c;--bg:#06090c;--card:#10161c;--card2:#18212b;--line:#22303c;--text:#eaf6fb;--muted:#8fa3b2;--accent:#38e1ff;--ink:#021219;--warn:#ffb547;--red:#ff6b6b;--green:#2bd47d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(86px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
body.noscroll{overflow:hidden}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted);margin-top:8px} .center{text-align:center} .red{color:var(--red)}
.brand{display:flex;align-items:center;gap:12px;padding:14px 0 2px}
.brand img{width:44px;height:44px;border-radius:13px;object-fit:cover;box-shadow:0 0 0 1px var(--glow),0 0 20px var(--glow)}
.brand .nm{font-family:Archivo;font-weight:900;font-size:19px;letter-spacing:.02em}
.brand .nm span{color:var(--accent);text-shadow:0 0 14px var(--glow)}
.ph{padding:14px 0 8px}.ph h1{font-size:28px;font-weight:900;line-height:1.1;margin-top:2px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:24px;margin:2px 0}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:0;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;margin-top:10px;text-align:center}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid rgba(255,107,107,.45)}
.btn.big{padding:16px;font-size:17px;margin:4px 0 10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:10px 0;display:block}
.quote{font-size:15px;color:var(--text);opacity:.9;font-style:italic;margin:2px 0 12px;padding:12px 14px;border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--glow2),transparent);border-radius:0 12px 12px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--muted)}.chip b{color:var(--text)}
.wo-card{background:radial-gradient(120% 140% at 100% 0%,var(--glow2),transparent 60%),var(--card)}
.wo-card.done{border-color:rgba(43,212,125,.5)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;cursor:pointer;color:var(--text)}
.ring{width:96px;height:96px;display:block;margin:0 auto}.ring .rv{fill:var(--text);font:800 13px Archivo,sans-serif}.ring .rs{fill:var(--muted);font:600 8px Inter,sans-serif}
.tl{font-weight:700;margin-top:4px;font-size:14px}.ts{font-size:12px;color:var(--muted)}
.wbtns{display:flex;gap:6px;justify-content:center;margin-top:6px}

<script>/* ===== Toshiroxx Levelling – animated exercise demos ===== */
(function(){
const L={t:44,ua:24,fa:22,th:30,sh:30,ft:9,hr:9,nk:5};
const G=166; // floor y
const C={near:"#38e1ff",far:"#1b7c90",eq:"#4d5c69",pad:"#2a3a47",padS:"#4d6170",db:"#cfd8df",cable:"#7f93a3",floor:"#22303c"};
const rad=a=>a*Math.PI/180;
const D=a=>[Math.sin(rad(a)),Math.cos(rad(a))];
const add=(p,v,s=1)=>[p[0]+v[0]*s,p[1]+v[1]*s];
const lerp=(a,b,t)=>a+(b-a)*t;
const f=n=>Math.round(n*10)/10;

function ik(P,X,a,b,rule,cx){
  let dx=X[0]-P[0],dy=X[1]-P[1],d=Math.hypot(dx,dy);
  if(d<1e-6){dx=0;dy=1;d=1e-6;}
  const mx=a+b-0.01,mn=Math.abs(a-b)+0.5;
  const dd=Math.min(mx,Math.max(mn,d));
  const T=[P[0]+dx/d*dd,P[1]+dy/d*dd];
  const th=Math.atan2(dy,dx);
  const al=Math.acos(Math.max(-1,Math.min(1,(a*a+dd*dd-b*b)/(2*a*dd))));
  const c1=[P[0]+a*Math.cos(th+al),P[1]+a*Math.sin(th+al)];
  const c2=[P[0]+a*Math.cos(th-al),P[1]+a*Math.sin(th-al)];
  let p1;
  if(typeof rule==="number") p1=rule>0;
  else switch(rule){
    case"down":p1=c1[1]>=c2[1];break;
    case"up":p1=c1[1]<=c2[1];break;
    case"front":p1=c1[0]>=c2[0];break;
    case"back":p1=c1[0]<=c2[0];break;
    case"out":p1=Math.abs(c1[0]-cx)>=Math.abs(c2[0]-cx);break;
    default:p1=c1[1]>=c2[1];
  }
  return [p1?c1:c2,T];
}

const DEF={h:[120,102],T:180,cv:0,hd:0,aS:1,lS:1,fan:90,faf:90};
function lerpPose(A,B,t){
  const o={};
  for(const k in A){
    const a=A[k],b=B[k]===undefined?a:B[k];
    if(Array.isArray(a)) o[k]=[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
    else if(typeof a==="number") o[k]=lerp(a,b,t);
    else o[k]=a;
  }
  return o;
}
function full(spec,fr,z0){
  const p=Object.assign({},DEF,spec.base||{},fr);
  if(spec.view==="front"){
    if(!p.hn)p.hn=[p.h[0]+15,p.h[1]+2];
    if(!p.fn)p.fn=[p.h[0]+8,G-4];
    if(!p.hf)p.hf=[2*p.h[0]-p.hn[0],p.hn[1]];
    if(!p.ff)p.ff=[2*p.h[0]-p.fn[0],p.fn[1]];
  }else{
    if(!p.hn)p.hn=[p.h[0]+2,p.h[1]+2];
    if(!p.fn)p.fn=[p.h[0],G-4];
    const fo=z0?[0,0]:(spec.fo||[-4,-2]),lo=z0?[0,0]:(spec.lo||[-5,-1]);
    if(!p.hf)p.hf=add(p.hn,fo);
    if(!p.ff)p.ff=add(p.fn,lo);
  }
  delete p.r;
  return p;
}

function solve(spec,p,R){
  const J={p};
  const aU=L.ua*p.aS,aF=L.fa*p.aS,lT=L.th*p.lS;
  if(spec.view==="front"){
    const h=p.h,cx=h[0];
    J.H=h;J.N=[cx,h[1]-L.t];J.head=[cx,h[1]-L.t-L.nk-L.hr];
    J.SR=[cx+13,h[1]-L.t+5];J.SL=[cx-13,h[1]-L.t+5];
    J.HR=[cx+7,h[1]];J.HL=[cx-7,h[1]];
    [J.ER,J.WR]=ik(J.SR,p.hn,aU,aF,R.en||"out",cx);
    [J.EL,J.WL]=ik(J.SL,p.hf,aU,aF,R.ef||R.en||"out",cx);
    [J.KR,J.AR]=ik(J.HR,p.fn,lT,L.sh,R.kn||"out",cx);
    [J.KL,J.AL]=ik(J.HL,p.ff,lT,L.sh,R.kf||R.kn||"out",cx);
    J.hn=J.WR;J.hf=J.WL;J.fn=J.AR;J.ff=J.AL;
  }else{

    J.H=h;J.S=add(h,D(p.T),L.t);J.head=add(J.S,D(p.T+p.hd),L.nk+L.hr);

    [J.Ef,J.Wf]=ik(J.S,p.hf,aU,aF,R.ef||R.en||"back");
    [J.Kn,J.An]=ik(h,p.fn,lT,L.sh,R.kn||"front");
    [J.Kf,J.Af]=ik(h,p.ff,lT,L.sh,R.kf||R.kn||"front");
    J.Tn=add(J.An,D(p.fan),L.ft);J.Tf=add(J.Af,D(p.faf),L.ft);
    J.hn=J.Wn;J.hf=J.Wf;J.fn=J.An;J.ff=J.Af;
  }
  return J;
}

const pl=(pts,c,w)=>`<polyline points="${pts.map(q=>f(q[0])+","+f(q[1])).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function drawFig(spec,J){

    s+=pl([J.SL,J.EL,J.WL],c,6)+pl([J.SR,J.ER,J.WR],c,6);
    s+=`<circle cx="${f(J.head[0])}" cy="${f(J.head[1])}" r="${L.hr}" fill="${c}"/>`;
    return s;
  }

  const m=[(J.H[0]+J.S[0])/2,(J.H[1]+J.S[1])/2],dv=D(p.T),perp=[dv[1],-dv[0]];
  const ctl=add(m,perp,-p.cv);
  s+=pl([J.S,J.Ef,J.Wf],C.far,6)+pl([J.H,J.Kf,J.Af,J.Tf],C.far,6);
  s+=`<path d="M${f(J.H[0])},${f(J.H[1])} Q${f(ctl[0])},${f(ctl[1])} ${f(J.S[0])},${f(J.S[1])}" fill="none" stroke="${C.near}" stroke-width="10" stroke-linecap="round"/>`;
  s+=`<circle cx="${f(J.head[0])}" cy="${f(J.head[1])}" r="${L.hr}" fill="${C.near}"/>`;
  s+=pl([J.H,J.Kn,J.An,J.Tn],C.near,7)+pl([J.S,J.En,J.Wn],C.near,6);
  return s;
}

/* ---- prop helpers ---- */

function frameAt(spec,time,fr){
  fr=fr||spec._f;const n=fr.length,dur=spec.dur||1.1,hold=spec.hold===undefined?.35:spec.hold,seg=dur+hold;
  let t=(time%(seg*n)+seg*n)%(seg*n);
  const i=Math.floor(t/seg),j=(i+1)%n;let u=t-i*seg;
  u=u<hold?0:(u-hold)/dur;
  if(!spec.linear)u=.5-.5*Math.cos(Math.PI*u);
  const pose=lerpPose(fr[i],fr[j],u);
  if(spec.polar)for(const k in spec.polar){const c=spec.polar[k],a=fr[i][k],b=fr[j][k];
    const ra=Math.hypot(a[0]-c[0],a[1]-c[1]),rb=Math.hypot(b[0]-c[0],b[1]-c[1]);
    let aa=Math.atan2(a[1]-c[1],a[0]-c[0]),ab=Math.atan2(b[1]-c[1],b[0]-c[0]);
    let dA=ab-aa;while(dA>Math.PI)dA-=2*Math.PI;while(dA<-Math.PI)dA+=2*Math.PI;
    const an=aa+dA*u,r=lerp(ra,rb,u);pose[k]=[c[0]+r*Math.cos(an),c[1]+r*Math.sin(an)];}
  const R=Object.assign({},spec.r||{},(spec.frames[j]&&spec.frames[j].r)||(spec.frames[i]&&spec.frames[i].r)||{});
  return [pose,R];
}
function render(spec,time){
  const [p,R]=frameAt(spec,time);
  const J=solve(spec,p,R);

}

  has:k=>!!SPECS[k],
  svg(k,time=0){const s=prep(k);return s?render(s,time):"";},
  mount(el,k){
    const s=prep(k);if(!s){el.style.display="none";return;}
    el.innerHTML=`<svg viewBox="0 0 240 180" role="img" aria-label="Animated demo"><g></g></svg><div class="demo-ov">❚❚</div>`;
    const g=el.querySelector("g");
    const st={el,g,s,t0:performance.now(),paused:false,off:0};
    el.onclick=()=>{st.paused=!st.paused;el.classList.toggle("paused",st.paused);if(!st.paused)st.t0=performance.now()-st.off*1000;};
    players.add(st);g.innerHTML=render(s,0);
  },
  unmountAll(root){players.forEach(p=>{if(!document.body.contains(p.el)||(root&&root.contains(p.el)))players.delete(p);});}
};
function loop(now){
  players.forEach(p=>{

    if(p.paused||p.el.offsetParent===null)return;
    p.off=(now-p.t0)/1000;p.g.innerHTML=render(p.s,p.off*(window.DEMO_SPEED||1));
  });
  requestAnimationFrame(loop);
}

    O.H=to3(spec,J.H);O.S=to3(spec,J.S);O.head=to3(spec,J.head);

function frame(spec,key){

    ["H","S","head","hdn","hdf","ann","anf","knn","knf","eln","elf"].forEach(k=>box.expandByPoint(O[k]));}
  box.expandByScalar(.3);box.min.y=Math.min(box.min.y,0);

  const set=VOVR[key]||VIEWS[spec.view==="front"?"front":"side"],d=V(...set[(viewIdx+(V0[key]||0))%set.length]).normalize();

      if(paused)pauseT=(performance.now()-t0)/1000;else t0=performance.now()-pauseT*1000;
    });
    return activate(el,key);
  },
  render(key,time,w,h){ // for testing
    if(!init())return null;active=null;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();load(key);draw(time);return R.domElement.toDataURL("image/jpeg",.85);
  },
  setView(i){viewIdx=i;}
};
addEventListener("resize",()=>{if(active)size();});
function loop(now){
  if(active&&R&&curSpec){
    if(!document.body.contains(active)){active=null;}
    else if(active.offsetParent!==null&&!paused){draw((now-t0)/1000*(window.DEMO_SPEED||1));}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

function defaults(){return{v:2,created:TODAY,profile:{done:false,name:"",sex:"m",age:25,height:170,weight:75,goal:"lose",diet:"veg",activity:1.55,stepGoal:8000,waterGoal:3000,str:30,tm:45,rest:0},
  week:{...SPLITS[0].week},custom:{},myEx:{},myFoods:[],days:{},weights:[],meas:[],photos:[],
  look:{theme:"cyber",logo:null,n1:"TOSHIROXX",n2:"LEVELLING"},dev:{use3d:true,speed:1,on:false},me:{id:Math.random().toString(36).slice(2,8)},
  friends:{},challenges:[],freezes:0,freezeUsed:[],freezeAwarded:0,music:{url:""},lastSync:null};}
let S=LS.get("tl2",null);
if(!S){S=defaults();const old=LS.get("tlCfg",null);
  if(old){if(old.name)S.profile.name=old.name;if(old.str)S.profile.str=old.str;if(old.tm!=null)S.profile.tm=old.tm;if(old.week)Object.assign(S.week,old.week);if(old.custom)S.custom=old.custom;}}
S=Object.assign(defaults(),S);const D0=defaults();S.profile=Object.assign(D0.profile,S.profile);S.look=Object.assign(D0.look,S.look);S.dev=Object.assign(D0.dev,S.dev);S.music=Object.assign(D0.music,S.music);if(!S.me||!S.me.id)S.me=D0.me;
const save=()=>{if(!LS.set("tl2",S))toast("Storage full – delete some photos");};
function day(k=TODAY){return S.days[k]||(S.days[k]={steps:0,water:0,food:[],log:{},swaps:{}});}
const peekDay=k=>S.days[k]||null;

const woId=k=>S.week[dow(k)]||"rest";
function workoutFor(k){const id=woId(k),w=WORKOUTS[id]||WORKOUTS.rest;const d=peekDay(k);
  let ex=(S.custom[id]||w.ex||[]).filter(x=>exInfo(x));
  if(d&&d.swaps)ex=ex.map(x=>d.swaps[x]||x);
  if(d&&d.quick)ex=ex.slice(0,3);
  return{id,...w,ex};}
const setsFor=(k,x)=>{const d=peekDay(k);return d&&d.quick?2:(exInfo(x).s||3);};

/* ---------- nutrition targets ---------- */
function targets(){const p=S.profile,w=+p.weight||70,h=+p.height||170,a=+p.age||25;
  const bmr=10*w+6.25*h-5*a+(p.sex==="f"?-161:5),tdee=bmr*(+p.activity||1.55);
  let kcal=p.goal==="lose"?tdee-500:p.goal==="gain"?tdee+300:tdee;kcal=Math.max(kcal,p.sex==="f"?1200:1500);kcal=R(kcal/10)*10;
  const pw=Math.min(w,Math.max(45,h-95));const prot=R(pw*(p.goal==="lose"?1.6:p.goal==="gain"?1.8:1.4));
  const fat=R(kcal*.25/9),carb=Math.max(0,R((kcal-prot*4-fat*9)/4));
  return{bmr:R(bmr),tdee:R(tdee),kcal,prot,fat,carb,bmi:w/((h/100)**2)};}
const sumFood=k=>{const d=peekDay(k);const t={kcal:0,p:0,c:0,f:0};if(d)d.food.forEach(x=>{t.kcal+=x.kcal*x.q;t.p+=x.p*x.q;t.c+=x.c*x.q;t.f+=x.f*x.q;});return t;};
const stepKcal=st=>st*(+S.profile.weight||70)*0.0005;
const stepKm=st=>st*(+S.profile.height||170)*0.415/100000;
function burned(k){const d=peekDay(k);if(!d)return 0;let b=stepKcal(d.steps||0);
  const w=workoutFor(k);if(!w.rest&&d.log){let tot=0,dn=0;w.ex.forEach(x=>{const L=d.log[x]||[];for(let j=0;j<setsFor(k,x);j++){tot++;if(L[j]&&L[j].done)dn++;}});
    if(tot)b+=5*(+S.profile.weight||70)*(S.profile.str/60)*(dn/tot);}
  return R(b);}

/* ---------- workout history ---------- */
const dayKeys=()=>Object.keys(S.days).sort();
function lastPerf(x,before=TODAY){const ks=dayKeys().filter(k=>k<before).reverse();
  for(const k of ks){const L=(S.days[k].log||{})[x];if(L&&L.some(s=>s&&s.done))return{k,sets:L.filter(s=>s&&s.done)};}return null;}
function best(x,before){let b=null;dayKeys().forEach(k=>{if(before&&k>=before)return;const L=(S.days[k].log||{})[x];if(!L)return;
  L.forEach(s=>{if(!s||!s.done)return;const v=BW.has(x)||TIMED.has(x)&&!s.kg?(+s.reps||0):(+s.kg||0);const sc=v*1000+(+s.reps||0);if(!b||sc>b.sc)b={kg:+s.kg||0,reps:+s.reps||0,k,sc};});});return b;}
function sessionDone(k){const d=peekDay(k);if(!d)return false;if(d.done)return true;const w=workoutFor(k);if(w.rest)return !!d.treadDone;
  return Object.values(d.log||{}).some(L=>L.some(s=>s&&s.done));}
function lastTrained(){const out={};dayKeys().forEach(k=>{const d=S.days[k];Object.entries(d.log||{}).forEach(([x,L])=>{if(L.some(s=>s&&s.done)){const g=exGroup(x);if(!out[g]||out[g]<k)out[g]=k;}});});return out;}
function recovery(){const lt=lastTrained(),out={};Object.keys(GNAME).forEach(g=>{if(!lt[g]){out[g]={c:"g",t:"Ready"};return;}
  const days=Math.round((new Date(TODAY)-new Date(lt[g]))/864e5);out[g]=days<=0?{c:"r",t:"Trained today"}:days===1?{c:"y",t:"1 day ago"}:{c:"g",t:days+" days ago"};});return out;}
function streak(){let n=0,k=TODAY;if(!sessionDone(k))k=addDays(k,-1);
  for(let i=0;i<400;i++){if(k<S.created)break;const w=WORKOUTS[woId(k)];if(w.rest||sessionDone(k)||S.freezeUsed.includes(k))n++;else break;k=addDays(k,-1);}return n;}
function freezeCheck(){const y=addDays(TODAY,-1);if(y<S.created)return;const w=WORKOUTS[woId(y)];
  if(!w.rest&&!sessionDone(y)&&!S.freezeUsed.includes(y)&&S.freezes>0){S.freezes--;S.freezeUsed.push(y);save();setTimeout(()=>toast("❄️ Streak freeze used for yesterday — your streak is safe!"),800);}
  const st=streak();if(st>=7&&Math.floor(st/7)>S.freezeAwarded){S.freezeAwarded=Math.floor(st/7);if(S.freezes<2){S.freezes++;setTimeout(()=>toast("❄️ You earned a streak freeze!"),2600);}save();}}
function workoutsCount(){return dayKeys().filter(k=>{const d=S.days[k];return Object.values(d.log||{}).some(L=>L.some(s=>s&&s.done));}).length;}

/* ---------- badges ---------- */
function badges(){const days=dayKeys().map(k=>[k,S.days[k]]),t=targets(),wc=workoutsCount(),st=streak();
  const maxSteps=Math.max(0,...days.map(([k,d])=>d.steps||0));
  const waterDays=days.filter(([k,d])=>(d.water||0)>=S.profile.waterGoal).length;
  const protDays=days.filter(([k])=>sumFood(k).p>=t.prot).length;
  const big=days.some(([k,d])=>Object.entries(d.log||{}).reduce((a,[x,L])=>a+Math.max(0,...L.filter(s=>s&&s.done).map(s=>+s.kg||0)),0)>=100);
  const prs=dayKeys().some(k=>Object.keys(S.days[k].log||{}).some(x=>{const b=best(x);return b&&b.k===k&&lastPerf(x,k);}));
  return[
    {i:"🏁",n:"First Workout",d:"Finish your first workout",ok:wc>=1},
    {i:"🔥",n:"7-Day Streak",d:"7 days in a row (rest days count)",ok:st>=7},
    {i:"💪",n:"10 Workouts",d:"Complete 10 workouts",ok:wc>=10},
    {i:"👟",n:"10K Steps Club",d:"Walk 10,000 steps in a day",ok:maxSteps>=10000},
    {i:"💧",n:"Hydration Hero",d:"Hit your water goal on 7 days",ok:waterDays>=7},
    {i:"🥚",n:"Protein Pro",d:"Hit your protein target on 5 days",ok:protDays>=5},
    {i:"⚡",n:"New Record",d:"Beat a personal record",ok:prs},
    {i:"🏋️",n:"100 kg Club",d:"Top sets add up to 100 kg in one workout",ok:big},
    {i:"📏",n:"Measured",d:"Log your weight 4 times",ok:S.weights.length>=4},
    {i:"👑",n:"30-Day Champion",d:"30-day streak",ok:st>=30}];}

const ring=(v,max,col,label,sub)=>{const p=Math.max(0,Math.min(1,max?v/max:0)),C=2*Math.PI*30;
  return `<svg viewBox="0 0 76 76" class="ring"><circle cx="38" cy="38" r="30" stroke="var(--card2)" stroke-width="8" fill="none"/><circle cx="38" cy="38" r="30" stroke="${col}" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 38 38)"/><text x="38" y="37" text-anchor="middle" class="rv">${label}</text><text x="38" y="50" text-anchor="middle" class="rs">${sub}</text></svg>`;};
const bar=(v,max,col)=>`<div class="bar"><i style="width:${Math.min(100,max?v/max*100:0)}%;background:${col}"></i></div>`;
function lineChart(pts,unit,col="var(--accent)"){if(pts.length<2)return `<p class="note">Add at least 2 entries to see a chart.</p>`;
  const W=320,H=140,P=26,ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1;
  const X=i=>P+i*(W-P*2)/(pts.length-1),Y=v=>H-22-(v-mn)/rg*(H-44);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="${col}"/>`).join("")}
  <text x="${X(0)}" y="${H-4}" class="cl">${fmtD(pts[0].x)}</text><text x="${X(pts.length-1)}" y="${H-4}" class="cl" text-anchor="end">${fmtD(pts[pts.length-1].x)}</text>
  <text x="2" y="${Y(mx)+4}" class="cl">${r1(mx)}</text><text x="2" y="${Y(mn)+4}" class="cl">${r1(mn)}</text></svg><p class="note" style="text-align:center">${unit}</p>`;}
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening";};

function coachTips(){const d=day(),t=targets(),w=workoutFor(TODAY),f=sumFood(TODAY),h=new Date().getHours(),tips=[],p=S.profile;
  if(!w.rest){if(sessionDone(TODAY))tips.push(["✅","Workout done today. Great job — now eat some protein and rest well."]);
    else{const rc=recovery(),tired=[...new Set(w.ex.map(exGroup))].filter(g=>rc[g].c!=="g");
      tips.push(["🏋️",`Today is <b>${esc(w.title)}</b> — ${w.ex.length} exercises, about ${p.str} min. Tap <b>Start workout</b>.`]);
      if(tired.length)tips.push(["🟡",`Your ${tired.map(g=>GNAME[g].toLowerCase()).join(" & ")} trained recently — go a bit lighter today.`]);}}
  else tips.push(["😴",w.tread?`Recovery day: just the ${p.tm}-min treadmill walk and stretching.`:"Rest day. Sleep 7–8 hours and take a relaxed walk."]);
  const left=p.stepGoal-(d.steps||0);if(left>0)tips.push(["👟",`${left.toLocaleString()} steps to go — about ${Math.ceil(left/110)} min of walking.`]);
  const wantW=p.waterGoal*Math.min(1,Math.max(0,(h-7)/14));if((d.water||0)<wantW-250)tips.push(["💧",`Drink a glass of water now — ${r1((p.waterGoal-d.water)/1000)} L left today.`]);
  if(h>=14&&f.p<t.prot*.5){const ideas={veg:"paneer, curd, soya chunks, dal or whey",vegan:"soya chunks, tofu, sprouts, chana or dal",egg:"eggs, paneer, curd or dal",nonveg:"chicken, eggs, fish or paneer"}[p.diet];tips.push(["🥚",`Protein is low (${R(f.p)} of ${t.prot} g). Add ${ideas}.`]);}
  if(f.kcal>t.kcal+100)tips.push(["⚖️",`You're ${R(f.kcal-t.kcal)} kcal over today's target. Keep dinner light and take a walk.`]);
  return tips.slice(0,4);}

function handleIncoming(){let changed=false;const qs=new URLSearchParams(location.search);const h=(location.hash||"").slice(1);

  const mh=h.match(/^steps-(\d+)$/);if(mh)steps=mh[1];const mf=h.match(/^friend-([A-Za-z0-9_-]+)$/);if(mf)friend=mf[1];
  if(steps!=null&&/^\d+(\.\d+)?$/.test(steps)){const v=R(+steps);day().steps=v;S.lastSync=Date.now();save();changed=true;setTimeout(()=>toast(`👟 Synced from Apple Health: ${v.toLocaleString()} steps`),400);}
  if(friend){const o=decodeFriend(friend);if(o&&o.i&&o.i!==S.me.id){const isNew=!S.friends[o.i];S.friends[o.i]={...o,got:Date.now()};save();changed=true;setTimeout(()=>toast(isNew?`👥 ${o.n} added as a friend!`:`👥 ${o.n}'s progress updated`),500);}}
  if(changed){try{history.replaceState(null,"",location.pathname+"#home");}catch(e){}}return changed;}

/* ---------- barcode scanner ---------- */
let scanner=null;const SCAN_LIB=window.SCAN_LIB||"https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
function loadScript(src){return new Promise((ok,no)=>{if(window.Html5Qrcode)return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s);});}
async function stopScan(){if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}scanner=null;}}
function scanSheet(){openSheet("Scan barcode",`<p class="note">Point the camera at the barcode on a packaged food (biscuits, chips, protein bar, juice…).</p>
  <div id="reader" class="reader"></div><div id="scMsg" class="note center"></div>
  <button class="btn" id="scGo">📷 Start camera</button>
  <label class="btn ghost filebtn">🖼️ Scan from a photo<input type="file" accept="image/*" id="scFile"></label>
  <div class="field"><label>Or type the number under the barcode</label><div class="addrow"><input id="scCode" inputmode="numeric" placeholder="e.g. 8901063010031"><button class="btn" id="scLook">Find</button></div></div>
  <p class="note">Food data from Open Food Facts (free, community database). Always check against the label.</p>`,()=>{
  const msg=t=>{const m=$("#scMsg");if(m)m.textContent=t;};
  const lib=async()=>{msg("Loading scanner…");try{await loadScript(SCAN_LIB);msg("");return true;}catch(e){msg("Couldn't load the scanner. Check your internet or type the number.");return false;}};
  const fmts=()=>window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128]:undefined;
  $("#scGo").onclick=async()=>{if(!await lib())return;await stopScan();scanner=new Html5Qrcode("reader",{formatsToSupport:fmts(),verbose:false});
    try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:130}},code=>{stopScan();lookupBarcode(code);},()=>{});$("#scGo").style.display="none";msg("Scanning…");}
    catch(e){msg(onGithub()?"Camera blocked. Allow camera for this site in Settings → Safari → Camera, or scan from a photo.":"The camera works on the main website link. Here, type the number or use a photo.");}};
  $("#scFile").onchange=async e=>{const f=e.target.files[0];if(!f||!await lib())return;await stopScan();const tmp=new Html5Qrcode("reader",{formatsToSupport:fmts(),verbose:false});
    try{const code=await tmp.scanFile(f,false);lookupBarcode(code);}catch(err){msg("No barcode found in that photo. Try a closer, sharper photo.");}};
  $("#scLook").onclick=()=>{const c=$("#scCode").value.replace(/\D/g,"");if(c.length<6){toast("Enter the barcode number");return;}lookupBarcode(c);};});}
async function lookupBarcode(code){await stopScan();const known=S.myFoods.find(f=>f.code===code);if(known)return qtySheet({...known,ic:"📷"});
  openSheet("Looking up…",`<div class="center" style="padding:30px"><div class="spin"></div><p class="note">Barcode ${esc(code)}</p></div>`);
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,nutriments,serving_size,serving_quantity,image_front_small_url`);
    const j=await r.json();if(!j||j.status!==1||!j.product)throw new Error("nf");const p=j.product,nu=p.nutriments||{};
    const kcal100=+nu["energy-kcal_100g"]||(+nu["energy_100g"]||0)/4.184;if(!kcal100)throw new Error("nn");
    const g=+p.serving_quantity||100,sc=g/100,name=[(p.product_name_en||p.product_name||"Packaged food").trim(),p.brands?"("+p.brands.split(",")[0].trim()+")":""].join(" ").trim();
    const fd={n:name,sv:p.serving_size?p.serving_size:`${R(g)} g`,kcal:R(kcal100*sc),p:r1((+nu.proteins_100g||0)*sc),c:r1((+nu.carbohydrates_100g||0)*sc),f:r1((+nu.fat_100g||0)*sc),code,img:p.image_front_small_url||null,cat:"Scanned",ic:"📷"};
    S.myFoods=S.myFoods.filter(f=>f.code!==code);S.myFoods.push(fd);save();qtySheet(fd);}
  catch(e){myFoodSheet(code,e.message==="nf"||e.message==="nn"?"Not found in the database — copy the numbers from the label once and it's saved for next time.":"Couldn't reach the food database. Check your internet, or enter it from the label.");}}

  if(m)return{src:`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`,h:80,kind:"Spotify"};
  m=u.match(/^https:\/\/music\.apple\.com\/(.+)$/);if(m)return{src:"https://embed.music.apple.com/"+m[1],h:175,kind:"Apple Music"};return null;}
function musicDock(play){const d=$("#music"),e=musicEmbed(S.music.url);if(!e){d.classList.remove("show");d.innerHTML="";return;}

   <iframe src="${e.src}" height="${e.h}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Music player"></iframe>`;}

/* ---------- friends & challenges ---------- */
const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function decodeFriend(p){try{p=p.replace(/-/g,"+").replace(/_/g,"/");while(p.length%4)p+="=";const o=JSON.parse(decodeURIComponent(escape(atob(p))));
  if(!o||typeof o!=="object")return null;return{i:String(o.i||"").slice(0,12),n:String(o.n||"Friend").slice(0,24),s:+o.s||0,w:+o.w||0,p:+o.p||0,st:+o.st||0,b:+o.b||0,t:+o.t||Date.now(),c:o.c&&typeof o.c==="object"?o.c:{}};}catch(e){return null;}}
const CHALLENGES=[
 {id:"streak7",i:"🔥",n:"7-Day Streak",d:"Keep your streak for 7 days",p:()=>Math.min(1,streak()/7),v:()=>`${Math.min(7,streak())}/7 days`},
 {id:"steps50",i:"👟",n:"50K Steps Week",d:"Walk 50,000 steps this week",p:()=>Math.min(1,weekSteps()/50000),v:()=>`${weekSteps().toLocaleString()} / 50,000`},
 {id:"work4",i:"💪",n:"4 Workouts Week",d:"Finish 4 workouts this week",p:()=>Math.min(1,weekReport().done/4),v:()=>`${weekReport().done}/4 workouts`},
 {id:"water5",i:"💧",n:"Hydration Week",d:"Hit your water goal on 5 days",p:()=>Math.min(1,weekReport().water/5),v:()=>`${weekReport().water}/5 days`},
 {id:"prot5",i:"🥚",n:"Protein Week",d:"Hit your protein target on 5 days",p:()=>Math.min(1,weekProtDays()/5),v:()=>`${weekProtDays()}/5 days`}];
function weekKeys(){const mon=addDays(TODAY,-((dow(TODAY)+6)%7));return Array.from({length:7},(_,i)=>addDays(mon,i)).filter(k=>k<=TODAY);}
const weekSteps=()=>weekKeys().reduce((a,k)=>a+((peekDay(k)||{}).steps||0),0);
const weekProtDays=()=>{const t=targets();return weekKeys().filter(k=>sumFood(k).p>=t.prot).length;};
function myPayload(){const wr=weekReport(),c={};S.challenges.forEach(id=>{const ch=CHALLENGES.find(x=>x.id===id);if(ch)c[id]=R(ch.p()*100);});
  return{i:S.me.id,n:S.profile.name||"Friend",s:streak(),w:wr.done,p:wr.planned,st:weekSteps(),b:badges().filter(x=>x.ok).length,t:Date.now(),c};}
const myLink=()=>appBase()+"?friend="+b64u(JSON.stringify(myPayload()));
async function shareMe(nudge){const p=myPayload(),link=myLink();
  const text=nudge?`Hey ${nudge}! I'm on a 🔥 ${p.s}-day streak on ${S.look.n1} ${S.look.n2}. Your turn — open my link and send yours back: ${link}`:`I'm on a 🔥 ${p.s}-day streak on ${S.look.n1} ${S.look.n2}! Tap to add me as a friend, then send me your link: ${link}`;
  if(navigator.share){try{await navigator.share({title:"My fitness streak",text});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  openSheet("Share with a friend",`<p class="note">Send this to your friend. When they open it, you appear in their friends list.</p><textarea rows="5" readonly id="shT">${esc(text)}</textarea>
   <div class="qrow"><button class="btn" id="shC">Copy</button><a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a></div>`,
   ()=>{$("#shC").onclick=async()=>{try{await navigator.clipboard.writeText(text);toast("Copied");}catch(e){$("#shT").select();toast("Select and copy");}};});}
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<60?"just now":m<1440?Math.floor(m/60)+" h ago":Math.floor(m/1440)+" d ago";};
const avatar=n=>{const cols=["#38e1ff","#ff6fb5","#a6ff3b","#f5c451","#b57bff","#ff9f7a","#2ee6c5"];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%997;return `<span class="av" style="background:${cols[h%cols.length]}">${esc((n||"?")[0].toUpperCase())}</span>`;};
function friendsCard(){const me={...myPayload(),me:1};const list=[me,...Object.values(S.friends)].sort((a,b)=>b.s-a.s||b.w-a.w);
  const joined=CHALLENGES.filter(c=>S.challenges.includes(c.id)),other=CHALLENGES.filter(c=>!S.challenges.includes(c.id));
  return `<div class="card"><div class="row-between"><b>👥 Friends streak board</b><button class="linkbtn" data-act="fadd">＋ Add friend</button></div>
   ${list.map((f,i)=>`<button class="frd ${f.me?"me":""}" ${f.me?"":`data-friend="${esc(f.i)}"`}><span class="rk">${i+1}</span>${avatar(f.n)}<span class="fn"><b>${esc(f.me?"You":f.n)}</b><small>${f.w}/${f.p||"–"} workouts · ${f.st.toLocaleString()} steps this week${f.me?"":" · "+ago(f.t)}</small></span><span class="fs">🔥 ${f.s}</span></button>`).join("")}
   ${Object.keys(S.friends).length?"":`<p class="note">Invite friends to compete on streaks. Share your link — when they open it and send theirs back, you'll see each other here.</p>`}
   <button class="btn" data-act="fshare">📤 Share my progress</button>
   <p class="note">Friends' numbers update each time they share their link with you.</p></div>
  <div class="card"><b>🏆 Challenges</b>
   ${joined.map(c=>{const fr=Object.values(S.friends).filter(f=>f.c&&f.c[c.id]!=null);return `<div class="chal"><div class="row-between"><span>${c.i} <b>${c.n}</b></span><small class="muted">${c.v()}</small></div>${bar(c.p(),1,c.p()>=1?"var(--green)":"var(--accent)")}
     ${fr.map(f=>`<div class="chf">${avatar(f.n)}<span>${esc(f.n)}</span>${bar(f.c[c.id],100,"var(--muted)")}<small>${f.c[c.id]}%</small></div>`).join("")}
     <button class="linkbtn small" data-leave="${c.id}">Leave</button></div>`;}).join("")}
   ${other.length?`<p class="note">Join a challenge, then share your progress so friends can join too:</p>${other.map(c=>`<button class="lrow" data-join="${c.id}"><b>${c.i} ${c.n}</b><small>${c.d}</small></button>`).join("")}`:""}</div>`;}
function friendSheet(id){const f=S.friends[id];if(!f)return;openSheet(f.n,`<div class="center">${avatar(f.n)}</div>
  <div class="stats"><div><b>🔥 ${f.s}</b><span>streak</span></div><div><b>${f.w}/${f.p||"–"}</b><span>workouts</span></div><div><b>${f.st.toLocaleString()}</b><span>week steps</span></div></div>
  <p class="note center">Updated ${ago(f.t)}${f.b?` · ${f.b} badges`:""}</p>
  <button class="btn" id="fnud">👋 Nudge ${esc(f.n)} (send my progress)</button><button class="btn danger" id="frm">Remove friend</button>`,
  ()=>{$("#fnud").onclick=()=>shareMe(f.n);$("#frm").onclick=()=>{delete S.friends[id];save();closeSheet();refresh();toast("Removed");};});}
function addFriendSheet(){openSheet("Add a friend",`<ol class="steps big"><li>Tap <b>Share my link</b> and send it to your friend (WhatsApp, Instagram…).</li><li>Your friend opens it and taps <b>Share my progress</b> on their side.</li><li>Open their link — they appear on your streak board.</li></ol>
  <button class="btn" id="afS">📤 Share my link</button><div class="field"><label>Got a friend's link? Paste it here</label><div class="addrow"><input id="afL" placeholder="https://…?friend=…"><button class="btn" id="afA">Add</button></div></div>`,
  ()=>{$("#afS").onclick=()=>shareMe();$("#afA").onclick=()=>{const v=$("#afL").value.trim(),m=v.match(/friend[=-]([A-Za-z0-9_-]+)/);const o=m&&decodeFriend(m[1]);
    if(!o||!o.i){toast("That link didn't work");return;}if(o.i===S.me.id){toast("That's your own link 🙂");return;}S.friends[o.i]={...o,got:Date.now()};save();closeSheet();refresh();toast(`👥 ${o.n} added`);};});}

function show(t){tab=t;$$("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===t));$$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t));

  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="steps")return stepsSheet();

    if(act==="dtoday"){delete S.days[TODAY];save();refreshAll();toast("Today cleared");return;}
    if(act==="dupdate"){(async()=>{try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}location.reload();})();return;}

    if(act==="addm"){const m={d:TODAY};let any=false;[["waist","mWaist"],["chest","mChest"],["arm","mArm"],["thigh","mThigh"]].forEach(([f,id])=>{const v=parseFloat($("#"+id).value);if(v>0){m[f]=v;any=true;}});if(!any){toast("Enter at least one number");return;}

    if(act==="eadd"){const v=$("#eAdd").value;if(!v)return;const l=(S.custom[editWo]||WORKOUTS[editWo].ex).slice();l.push(v);return setList(l);}
    if(act==="ereset"){delete S.custom[editWo];save();renderProfile();toast("Restored");return;}

      ()=>{$("#rNo").onclick=closeSheet;$("#rYes").onclick=()=>{S=defaults();save();closeSheet();show("home");onboarding();};});return;}
  }
  const dd=e.target.closest("[data-day]");if(dd){curDay=dd.dataset.day;openCards.clear();renderWorkout();return;}

  const mv=e.target.closest("[data-mv]");if(mv){const i=+mv.dataset.i,l=(S.custom[editWo]||WORKOUTS[editWo].ex).slice();if(mv.dataset.mv==="rm")l.splice(i,1);else{const j=mv.dataset.mv==="up"?i-1:i+1;[l[i],l[j]]=[l[j],l[i]];}return setList(l);}
  const sp=e.target.closest("[data-split]");if(sp){const s=SPLITS.find(x=>x.id===sp.dataset.split);S.week={...s.week};save();renderProfile();toast(s.name+" selected");return;}
  const th=e.target.closest("[data-theme]");if(th){S.look.theme=th.dataset.theme;save();applyLook();renderProfile();toast(THEMES[S.look.theme].n+" theme");return;}
  const fr=e.target.closest("[data-friend]");if(fr)return friendSheet(fr.dataset.friend);
  const jn=e.target.closest("[data-join]");if(jn){S.challenges.push(jn.dataset.join);save();renderHome();toast("Challenge joined — share it with friends!");return;}
  const lv=e.target.closest("[data-leave]");if(lv){S.challenges=S.challenges.filter(c=>c!==lv.dataset.leave);save();renderHome();return;}
  const dp=e.target.closest("[data-delph]");if(dp){S.photos.splice(+dp.dataset.delph,1);save();renderProgress();return;}
});
document.addEventListener("change",e=>{if(e.target.id==="quick"){const d=day();d.quick=e.target.checked;save();renderWorkout();toast(d.quick?"Quick mode: 3 exercises × 2 sets":"Full workout");}
  const r=e.target.closest&&e.target.closest(".setrow");if(r&&e.target.dataset.f){const d=day(),x=r.dataset.x,j=+r.dataset.j,L=d.log[x]||(d.log[x]=[]);const s=L[j]||(L[j]={});s[e.target.dataset.f]=parseFloat(e.target.value)||0;save();}});
document.addEventListener("toggle",e=>{if(e.target.open)e.target.querySelectorAll(".demo").forEach(mountDemo);},true);
$("#sheet .sheet-bg").onclick=closeSheet;$("#sheetClose").onclick=closeSheet;
$("#tskip").onclick=()=>{clearInterval(tInt);$("#timer").classList.remove("show");};
$$("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
applyLook();const inc=handleIncoming();freezeCheck();
const h0=(location.hash||"").slice(1);show(!inc&&["home","workout","food","progress","profile"].includes(h0)?h0:"home");
if(S.music.url){musicDock(false);$("#music").classList.add("min");}
pwa();
if(!S.profile.done)onboarding();
})();
</script>
